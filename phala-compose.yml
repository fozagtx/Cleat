# Phala Cloud overlay for Cleat.
# Usage (after images are on a public registry):
#   npx phala login
#   npx phala deploy -n cleat -c phala-compose.yml -t tdx.small --wait
#
# Phala cannot build from local Dockerfiles. Push the official stack first:
#   docker compose -f docker-compose.yaml -f docker-compose.coston2.yaml build
#   docker tag local/tee-proxy:latest <registry>/cleat-tee-proxy:v0.1.0
#   docker tag <cleat-extension-tee> <registry>/cleat-extension-tee:v0.1.0
#
# Replace the image: lines below. Do not add `build:`.
# Official docker-compose.yaml stays the laptop path. Do not delete it.

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    tmpfs:
      - /data
    restart: unless-stopped

  ext-proxy:
    image: ${CLEAT_PROXY_IMAGE:-cleat/tee-proxy:v0.1.0}
    environment:
      - PROXY_PRIVATE_KEY=${PROXY_PRIVATE_KEY}
    ports:
      - "6663:6663"
      - "6664:6664"
    depends_on:
      - redis
    restart: unless-stopped

  extension-tee:
    image: ${CLEAT_TEE_IMAGE:-cleat/extension-tee:v0.1.0}
    environment:
      - MODE=1
      - CHAIN_ID=114
      - CHAIN_URL=${CHAIN_URL:-https://coston2-api.flare.network/ext/C/rpc}
      - INITIAL_OWNER=${INITIAL_OWNER}
      - GOVERNANCE_SIGNERS=${GOVERNANCE_SIGNERS:-${INITIAL_OWNER}}
      - GOVERNANCE_THRESHOLD=${GOVERNANCE_THRESHOLD:-1}
      - PROXY_URL=http://ext-proxy:6663
      - CONFIG_PORT=5501
      - SIGN_PORT=7701
      - EXTENSION_PORT=7702
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SIMULATED_TEE=true
    depends_on:
      - ext-proxy
    restart: unless-stopped
