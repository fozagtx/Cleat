# Product overlay — Postgres for Fastify/Prisma.
# Usage: docker compose -f docker-compose.yaml -f docker-compose.coston2.yaml -f docker-compose.product.yaml up
# Official compose stays redis + ext-proxy + extension-tee.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cleat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cleat}
      POSTGRES_DB: ${POSTGRES_DB:-cleat}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - cleat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cleat} -d ${POSTGRES_DB:-cleat}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cleat_pg:
